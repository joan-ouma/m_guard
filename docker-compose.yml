services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: motoguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-motoguard}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motoguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motoguard-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-motoguard}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-motoguard-production-enterprise-secret-key-32bytes}
      CORS_ORIGINS: http://localhost:4200
      MQTT_BROKER_URL: tcp://mqtt:1883
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  mqtt:
    image: eclipse-mosquitto:2
    container_name: motoguard-mqtt
    restart: unless-stopped
    ports:
      - "1884:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: motoguard-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
