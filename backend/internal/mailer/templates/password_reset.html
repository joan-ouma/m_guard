<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reset your MotoGuard password</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #111; line-height: 1.5; padding: 20px;">
  <h2>Password Reset Request</h2>
  <p>Hello {{.Name}},</p>
  <p>We received a request to reset the password for your MotoGuard account.</p>
  <p><a href="{{.ResetURL}}">Reset Password</a></p>
  <p>Or open this link directly: <a href="{{.ResetURL}}">{{.ResetURL}}</a></p>
  <p style="color: #666; font-size: 13px;">This link will expire in 30 minutes. If you did not request a password reset, you can safely ignore this email.</p>
</body>
</html>
