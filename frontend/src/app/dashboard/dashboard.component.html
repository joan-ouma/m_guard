<div class="fixed inset-0 h-full w-full h-[100dvh] bg-white font-sans text-zinc-900 overflow-hidden select-none flex">
  <!-- Sidebar (Desktop & Mobile Drawer) -->
  <app-dashboard-sidebar
    [mobileDrawerOpen]="mobileDrawerOpen()"
    [user]="authService.currentUser()"
    (closeMobileDrawer)="closeMobileDrawer()"
    (openGeofenceModal)="toggleGeofenceModal(true)"
    (logout)="handleLogout()"
  />

  <div class="flex-1 flex flex-col h-full relative overflow-hidden">
    <app-dashboard-header
      [selectedBike]="selectedBike()"
      [hasBikes]="bikeList().length > 0"
      [isBreachActive]="isBreachActive()"
      [alertBannerText]="alertBannerText()"
      [notifications]="notifications()"
      [unreadCount]="unreadAlertCount()"
      (toggleMobileDrawer)="toggleMobileDrawer()"
      (openGeofenceModal)="toggleGeofenceModal(true)"
      (viewNotification)="viewNotification($event)"
      (markAllRead)="markAllNotificationsRead()"
    />

    <div class="flex-1 relative w-full h-full overflow-hidden">
      <div
        id="map"
        class="absolute inset-0 w-full h-full z-0"
        style="width: 100%; height: 100%"
      ></div>

      @if (showInspector()) {
        <app-bike-inspector
          [bikeList]="bikeList()"
          [selectedBike]="selectedBike()"
          [currentTime]="currentTime()"
          [copiedCoordinates]="copiedCoordinates()"
          [mobileSheetExpanded]="mobileSheetExpanded()"
          (toggleImmobilize)="toggleImmobilize($event)"
          (recenterMap)="recenterMap()"
          (copyCoordinates)="copyCoordinates()"
          (openRegisterModal)="openRegisterModal()"
          (toggleMobileSheet)="toggleMobileSheet()"
          (dismiss)="toggleInspector(false)"
        />
      }

      @if (!showInspector() && bikeList().length > 0) {
        <button
          type="button"
          (click)="toggleInspector(true)"
          aria-label="Show motorcycle details"
          title="Show details"
          class="absolute top-6 left-6 z-10 h-12 px-5 rounded-full bg-white border border-zinc-200 shadow-lg hover:bg-zinc-50 text-sm font-bold text-zinc-900 flex items-center gap-2.5 cursor-pointer transition-colors"
        >
          <svg
            class="w-5 h-5 text-zinc-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <span>{{ selectedBike()?.plate }}</span>
          <span class="text-zinc-400 font-medium">Details</span>
        </button>
      }

      <div
        class="absolute bottom-36 md:bottom-6 right-4 md:right-6 flex flex-col bg-white border border-zinc-200 rounded-2xl shadow-md overflow-hidden z-10"
      >
        <button
          type="button"
          (click)="zoomIn()"
          class="w-12 h-12 flex items-center justify-center text-zinc-700 hover:bg-zinc-100 font-bold text-xl border-b border-zinc-100 cursor-pointer"
        >
          +
        </button>
        <button
          type="button"
          (click)="zoomOut()"
          class="w-12 h-12 flex items-center justify-center text-zinc-700 hover:bg-zinc-100 font-bold text-xl cursor-pointer"
        >
          −
        </button>
      </div>
    </div>
  </div>

  <app-geofence-modal
    [isOpen]="showGeofenceModal()"
    [currentData]="currentGeofenceData()"
    (save)="saveGeofence($event)"
    (close)="toggleGeofenceModal(false)"
  />

  <app-register-bike-modal
    [isOpen]="showRegisterModal()"
    [isSubmitting]="isSubmitting()"
    [registrationError]="registrationError()"
    [currentUser]="authService.currentUser()"
    (register)="registerBike($event)"
    (close)="closeRegisterModal()"
  />

  <app-duress-modal
    [isOpen]="showDuressPrompt()"
    [countdown]="duressCountdown()"
    (cancel)="cancelDuress()"
    (escalate)="escalateDuress()"
  />
</div>
