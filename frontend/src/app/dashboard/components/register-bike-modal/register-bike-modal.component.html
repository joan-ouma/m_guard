@if (isOpen()) {
  <div class="fixed inset-0 bg-brand/50 z-50 flex items-center justify-center p-4">
    <div
      class="bg-surface border border-line rounded-2xl w-full max-w-md max-h-[92vh] flex flex-col overflow-hidden shadow-xl animate-in fade-in zoom-in-95 duration-150"
    >
      <div class="px-6 py-4 border-b border-line-soft flex items-center justify-between shrink-0">
        <h3 class="text-sm font-bold text-ink">Register New Motorcycle</h3>
        <button
          type="button"
          (click)="close.emit()"
          class="text-subtle hover:text-ink-soft text-xs font-semibold cursor-pointer"
        >
          ✕
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 space-y-4 overflow-y-auto flex-1">
        @if (registrationError()) {
          <div
            class="p-3 rounded-xl bg-brand-soft border border-brand-line text-brand-strong text-xs flex items-center gap-2"
          >
            <svg
              class="w-4 h-4 shrink-0 text-brand"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            <span>{{ registrationError() }}</span>
          </div>
        }

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-1">
            Registration Plate
          </label>
          <input
            type="text"
            formControlName="plate"
            placeholder="e.g. KMDH 102M"
            class="w-full bg-canvas border border-line rounded-xl px-3.5 py-2 text-sm font-plate font-black uppercase tracking-wider text-ink focus:outline-none focus:border-brand"
          />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-1">
            Make & Model
          </label>
          <input
            type="text"
            formControlName="model"
            placeholder="e.g. Bajaj Boxer BM150"
            class="w-full bg-canvas border border-line rounded-xl px-3.5 py-2 text-sm text-ink focus:outline-none focus:border-brand"
          />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-muted mb-1">
            Hardware IMEI (15 Digits)
          </label>
          <input
            type="text"
            formControlName="imei"
            placeholder="e.g. 359632101234567"
            class="w-full bg-canvas border border-line rounded-xl px-3.5 py-2 text-sm font-semibold text-ink focus:outline-none focus:border-brand"
          />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label
              class="block text-xs font-bold uppercase tracking-wider text-muted mb-1"
            >
              County
            </label>
            <input
              type="text"
              formControlName="county"
              class="w-full bg-canvas border border-line rounded-xl px-3.5 py-2 text-sm text-ink focus:outline-none focus:border-brand"
            />
          </div>
          <div>
            <label
              class="block text-xs font-bold uppercase tracking-wider text-muted mb-1"
            >
              Sub-County
            </label>
            <input
              type="text"
              formControlName="subCounty"
              class="w-full bg-canvas border border-line rounded-xl px-3.5 py-2 text-sm text-ink focus:outline-none focus:border-brand"
            />
          </div>
        </div>

        <!-- Assigned Rider Identity Section -->
        <div class="pt-3 border-t border-line-soft space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold uppercase tracking-wider text-muted">
              Assigned Rider Identity
            </span>
            <label class="inline-flex items-center gap-1.5 cursor-pointer text-xs text-info-strong font-semibold select-none">
              <input
                type="checkbox"
                formControlName="isSelfRider"
                (change)="onToggleSelfRider($event)"
                class="rounded text-info-strong focus:ring-brand w-3.5 h-3.5 cursor-pointer"
              />
              <span>I am the rider</span>
            </label>
          </div>

          <div>
            <label class="block text-xs font-medium text-ink-soft mb-1">
              Rider Full Name
            </label>
            <input
              type="text"
              formControlName="riderName"
              placeholder="e.g. John Kamau"
              class="w-full bg-canvas border border-line rounded-xl px-3.5 py-2 text-sm text-ink focus:outline-none focus:border-brand"
            />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-ink-soft mb-1">
                Kenyan National ID
              </label>
              <input
                type="text"
                formControlName="riderNationalId"
                placeholder="e.g. 29481023"
                class="w-full bg-canvas border border-line rounded-xl px-3.5 py-2 text-sm font-semibold text-ink focus:outline-none focus:border-brand"
              />
            </div>
            <div>
              <label class="block text-xs font-medium text-ink-soft mb-1">
                Phone Number
              </label>
              <input
                type="tel"
                formControlName="riderPhone"
                placeholder="e.g. 0712 345 678"
                class="w-full bg-canvas border border-line rounded-xl px-3.5 py-2 text-sm font-semibold text-ink focus:outline-none focus:border-brand"
              />
            </div>
          </div>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2">
          <button
            type="button"
            (click)="close.emit()"
            class="px-4 py-2 rounded-full border border-line text-ink-soft text-xs font-semibold hover:bg-canvas cursor-pointer"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="form.invalid || isSubmitting()"
            class="px-5 py-2 rounded-full bg-brand hover:bg-brand-strong disabled:opacity-50 text-surface text-xs font-semibold transition-colors cursor-pointer shadow-sm flex items-center gap-1.5"
          >
            @if (isSubmitting()) {
              <span
                class="w-3 h-3 border-2 border-surface/30 border-t-white rounded-full animate-spin"
              ></span>
              <span>Saving...</span>
            } @else {
              <span>Register Asset</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
