@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    style="
      background: radial-gradient(
        circle at center,
        color-mix(in srgb, var(--color-night) 60%, transparent) 0%,
        color-mix(in srgb, var(--color-night) 95%, transparent) 100%
      );
    "
  >
    <div
      class="bg-ink border border-line-strong rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl text-center p-8 animate-in zoom-in-95 duration-200 relative"
    >
      <!-- Pulsing ring background -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-48 h-48 rounded-full bg-brand/10 animate-ping"></div>
      </div>

      <div class="relative z-10">
        <div
          class="w-20 h-20 rounded-full bg-brand/20 text-brand flex items-center justify-center mx-auto mb-6"
        >
          <svg
            class="w-10 h-10"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
        </div>

        <h2 class="text-2xl font-bold text-surface mb-2 tracking-tight">Sudden Stop Detected</h2>
        <p class="text-subtle text-sm mb-8 font-medium">Are you okay? Checking in.</p>

        <div class="text-6xl font-plate font-black text-brand mb-8 tracking-wider">
          00:{{ countdown() < 10 ? '0' + countdown() : countdown() }}
        </div>

        <div class="space-y-4">
          <button
            type="button"
            (click)="cancel.emit()"
            class="w-full h-14 rounded-2xl bg-surface text-ink font-bold text-lg hover:bg-fill transition-colors active:scale-95 cursor-pointer shadow-lg"
          >
            Yes, I'm Okay
          </button>

          <button
            type="button"
            (click)="escalate.emit()"
            class="w-full h-14 rounded-2xl bg-brand/10 border border-brand/30 text-brand font-bold text-lg hover:bg-brand-strong hover:text-surface transition-colors active:scale-95 cursor-pointer"
          >
            I Need Help
          </button>
        </div>
      </div>
    </div>
  </div>
}
