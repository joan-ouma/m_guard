@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    style="
      background: radial-gradient(
        circle at center,
        rgba(0, 0, 0, 0.6) 0%,
        rgba(0, 0, 0, 0.95) 100%
      );
    "
  >
    <div
      class="bg-zinc-900 border border-zinc-800 rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl text-center p-8 animate-in zoom-in-95 duration-200 relative"
    >
      <!-- Pulsing ring background -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-48 h-48 rounded-full bg-rose-500/10 animate-ping"></div>
      </div>

      <div class="relative z-10">
        <div
          class="w-20 h-20 rounded-full bg-rose-500/20 text-rose-500 flex items-center justify-center mx-auto mb-6"
        >
          <svg
            class="w-10 h-10"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
        </div>

        <h2 class="text-2xl font-bold text-white mb-2 tracking-tight">Sudden Stop Detected</h2>
        <p class="text-zinc-400 text-sm mb-8 font-medium">Are you okay? Checking in.</p>

        <div class="text-5xl font-mono font-black text-rose-500 mb-8 tracking-tighter">
          00:{{ countdown() < 10 ? '0' + countdown() : countdown() }}
        </div>

        <div class="space-y-4">
          <button
            type="button"
            (click)="cancel.emit()"
            class="w-full h-14 rounded-2xl bg-white text-zinc-900 font-bold text-lg hover:bg-zinc-100 transition-colors active:scale-95 cursor-pointer shadow-lg"
          >
            Yes, I'm Okay
          </button>

          <button
            type="button"
            (click)="escalate.emit()"
            class="w-full h-14 rounded-2xl bg-rose-600/10 border border-rose-500/30 text-rose-500 font-bold text-lg hover:bg-rose-600 hover:text-white transition-colors active:scale-95 cursor-pointer"
          >
            I Need Help
          </button>
        </div>
      </div>
    </div>
  </div>
}
