<header
  class="h-16 lg:h-20 bg-white border-b border-zinc-200 px-4 lg:px-8 flex items-center justify-between shrink-0 z-30 relative"
>
  <div class="flex items-center gap-3 lg:gap-6 min-w-0">
    <button
      type="button"
      (click)="toggleMobileDrawer.emit()"
      title="Open Menu"
      class="lg:hidden w-10 h-10 rounded-xl flex items-center justify-center text-zinc-700 hover:bg-zinc-100 transition-colors cursor-pointer shrink-0"
    >
      <svg
        class="w-6 h-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div class="flex items-center gap-2 lg:gap-2.5 min-w-0">
      <span id="headerPlateLabel" class="text-base lg:text-lg font-bold tracking-tight text-zinc-950 font-display">
        MotoGuard
      </span>
    </div>

    @if (isBreachActive()) {
      <div
        id="alertBanner"
        class="flex items-center gap-1.5 lg:gap-2.5 bg-rose-50 border border-rose-200 text-rose-700 px-2.5 lg:px-4 py-1 lg:py-2 rounded-full text-xs lg:text-sm font-semibold truncate"
      >
        <span class="w-2 h-2 lg:w-2.5 lg:h-2.5 rounded-full bg-rose-600 shrink-0"></span>
        <span id="alertBannerText" class="truncate">{{ alertBannerText() }}</span>
      </div>
    }
  </div>

  <div class="flex items-center gap-2 lg:gap-4 shrink-0">
    @if (hasBikes()) {
      <button
        type="button"
        (click)="simulateSuddenStop.emit()"
        class="hidden sm:flex h-10 lg:h-12 px-3 lg:px-5 rounded-full border border-zinc-200 hover:bg-zinc-100 text-zinc-900 text-xs lg:text-sm font-bold items-center gap-1.5 lg:gap-2 cursor-pointer transition-colors"
      >
        <svg
          class="w-4 h-4 lg:w-5 lg:h-5 text-rose-500 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          />
        </svg>
        <span class="hidden sm:inline">Simulate Stop</span>
        <span class="sm:hidden">Stop</span>
      </button>

      <button
        type="button"
        (click)="openGeofenceModal.emit()"
        class="hidden sm:flex h-10 lg:h-12 px-3.5 lg:px-6 rounded-full bg-zinc-900 hover:bg-zinc-800 text-white text-xs lg:text-sm font-bold items-center gap-1.5 lg:gap-2.5 cursor-pointer shadow-xs transition-colors"
      >
        <svg
          class="w-4 h-4 lg:w-5 lg:h-5 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <span class="hidden sm:inline">Create Geofence</span>
        <span class="sm:hidden">Geofence</span>
      </button>
    }

    <!-- Notification Bell -->
    <app-notification-bell
      [notifications]="notifications()"
      [unreadCount]="unreadCount()"
      (viewNotification)="viewNotification.emit($event)"
      (markAllRead)="markAllRead.emit()"
    />
  </div>
</header>
