<div class="flex items-center justify-between w-full h-full min-w-0 gap-3">
  <div class="flex items-center gap-3 lg:gap-5 min-w-0">

    <!-- Mobile-Only Brand Icon & Bold Logo (Hidden on desktop where sidebar is visible) -->
    <div class="flex lg:hidden items-center gap-2.5 min-w-0">
      <div
        class="w-9 h-9 rounded-full bg-brand flex items-center justify-center text-surface shrink-0 shadow-xs"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
          />
        </svg>
      </div>
      <span id="headerPlateLabel" class="text-base sm:text-lg font-bold tracking-tight text-ink font-display">
        MGuard
      </span>
    </div>

    @if (isBreachActive()) {
      <div
        id="alertBanner"
        class="flex items-center gap-1.5 lg:gap-2.5 bg-brand-soft border border-brand-line text-brand-strong px-2.5 lg:px-4 py-1 lg:py-2 rounded-full text-xs lg:text-sm font-semibold truncate"
      >
        <span class="w-2 h-2 lg:w-2.5 lg:h-2.5 rounded-full bg-brand shrink-0"></span>
        <span id="alertBannerText" class="truncate">{{ alertBannerText() }}</span>
      </div>
    }
  </div>

  <div class="flex items-center gap-2 lg:gap-4 shrink-0">
    @if (hasBikes()) {

      <button
        type="button"
        (click)="openGeofenceModal.emit()"
        class="hidden sm:flex h-9 lg:h-10 px-3.5 lg:px-4 rounded-full bg-brand hover:bg-brand-strong text-surface text-xs font-semibold items-center gap-1.5 lg:gap-2 cursor-pointer shadow-xs transition-colors"
      >
        <svg
          class="w-4 h-4 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <span class="hidden sm:inline">Create Geofence</span>
        <span class="sm:hidden">Geofence</span>
      </button>
    }

    <!-- Notification Bell -->
    <app-notification-bell
      [notifications]="notifications()"
      [unreadCount]="unreadCount()"
      (viewNotification)="viewNotification.emit($event)"
      (markAllRead)="markAllRead.emit()"
    />
  </div>
</div>
