<div data-animation="over-left" class="navbar-fixed without-bg w-nav" data-collapse="medium">
  <div class="base-container w-container">
    <div class="nav-menu-wrapper">
      <a routerLink="/" class="brand w-nav-brand">
        <img src="/assets/landing/logo.svg" loading="lazy" alt="MGuard Logo" height="30" class="nav-logo">
      </a>
      <nav role="navigation" class="nav-menu w-nav-menu" [class.w--open]="mobileMenuOpen()">
        <div class="tablet-menu">
          <a routerLink="/" class="brand-tablet w-nav-brand">
            <img src="/assets/landing/logo.svg" loading="lazy" alt="MGuard Logo" height="30" class="nav-logo">
          </a>
          <div class="close-menu-button w-nav-button" (click)="toggleMobileMenu()" role="button" tabindex="0">
            <img src="/assets/landing/close-icon.png" loading="lazy" alt="" class="nav-close-icon">
          </div>
        </div>
        <div class="menu-wrap" (click)="mobileMenuOpen.set(false)">
          <a routerLink="/" class="nav-link w-nav-link">Home</a>
          <a routerLink="/about" class="nav-link w-nav-link">About Us</a>
          <a routerLink="/services" class="nav-link w-nav-link w--current">Services</a>
          <a routerLink="/contact" class="nav-link w-nav-link">Contact Us</a>
          <a routerLink="/login" class="primary-button w-inline-block get-started-btn" style="padding: 10px 24px; margin-left: 16px;">
            <div>Get Started</div>
          </a>
        </div>
      </nav>
      <div class="menu-button w-nav-button" (click)="toggleMobileMenu()" role="button" tabindex="0">
        <img src="/assets/landing/burger-icon.png" loading="lazy" alt="" height="16" class="image-burger">
      </div>
    </div>
  </div>
  <div class="w-nav-overlay" (click)="toggleMobileMenu()" [style.display]="mobileMenuOpen() ? 'block' : 'none'"></div>
</div>

@if (service(); as s) {
  <div class="inner-banner">
    <div class="base-container w-container">
      <div class="inner-banner-wrap">
        <h1 class="inner-title">{{ s.title }}</h1>
        <p class="inner-description">{{ s.intro }}</p>
      </div>
    </div>
  </div>

  <div class="inner-section">
    <div class="base-container w-container">
      <div class="service-detail">
        <img class="service-detail-image" [src]="s.image" [alt]="s.imageAlt" loading="lazy">
        <div class="service-detail-content">
          <h2>What you get</h2>
          <ul class="service-detail-points">
            @for (point of s.points; track point) {
              <li>{{ point }}</li>
            }
          </ul>
          <div class="service-detail-actions">
            <a routerLink="/signup" class="primary-button w-inline-block"><div>Protect Your Bike</div></a>
            <a routerLink="/contact" class="service-detail-secondary">Talk to our team</a>
          </div>
          <a routerLink="/services" class="link-with-icon w-inline-block">
            <div>Back to all services</div>
            <img src="/assets/landing/arrow-link.svg" loading="lazy" alt="Arrow">
          </a>
        </div>
      </div>
    </div>
  </div>
}

<app-public-footer></app-public-footer>
