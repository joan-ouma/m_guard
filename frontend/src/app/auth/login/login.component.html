<app-auth-layout
  heading="Sign in to your account"
  subHeading="Access your fleet's live telemetry, geofences, and alerts."
>
  <!-- Error Message Banner -->
  <div
    *ngIf="errorMessage()"
    class="mb-6 p-3.5 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 flex items-start gap-3 text-red-700 dark:text-red-400 text-xs"
    role="alert"
  >
    <svg class="w-4 h-4 shrink-0 mt-0.5 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
    <span class="leading-relaxed">{{ errorMessage() }}</span>
  </div>

  <!-- Login Form -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    
    <!-- Phone Number Field -->
    <div>
      <label for="phone" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
        Phone Number
      </label>
      <div class="relative">
        <input
          id="phone"
          type="tel"
          formControlName="phone"
          placeholder="+254 700 000000"
          autocomplete="tel"
          class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition"
          [class.border-red-400]="isFieldInvalid('phone')"
        />
      </div>
      <p *ngIf="isFieldInvalid('phone')" class="mt-1 text-[11px] text-red-500">
        Please enter a valid phone number.
      </p>
    </div>

    <!-- National ID Field -->
    <div>
      <label for="nationalId" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
        National ID Number
      </label>
      <div class="relative">
        <input
          id="nationalId"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="nationalId"
          placeholder="Enter ID number"
          class="w-full pl-4 pr-11 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition"
          [class.border-red-400]="isFieldInvalid('nationalId')"
        />
        <!-- Trailing Eye Toggle Button inside far right -->
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 focus:outline-none"
          [attr.aria-label]="showPassword() ? 'Hide ID' : 'Show ID'"
        >
          <!-- Eye Open -->
          <svg *ngIf="!showPassword()" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <!-- Eye Closed -->
          <svg *ngIf="showPassword()" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          </svg>
        </button>
      </div>
      <p *ngIf="isFieldInvalid('nationalId')" class="mt-1 text-[11px] text-red-500">
        A valid National ID is required.
      </p>
    </div>

    <!-- Vibrant Deep Blue-Violet CTA Button with Glowing Drop Shadow -->
    <div class="pt-3">
      <button
        type="submit"
        [disabled]="form.invalid || authService.isLoading()"
        class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-700 hover:from-blue-700 hover:via-indigo-700 hover:to-violet-800 active:scale-[0.99] text-white text-sm font-semibold shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/40 disabled:opacity-50 disabled:pointer-events-none transition duration-150 flex items-center justify-center gap-2 cursor-pointer"
      >
        <svg
          *ngIf="authService.isLoading()"
          class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ authService.isLoading() ? 'Signing in...' : 'Sign In' }}</span>
      </button>
    </div>
  </form>

  <!-- Clean Single-Line Footer Link -->
  <p class="text-xs text-slate-500 dark:text-slate-400 text-center mt-6">
    Forgot your password?
    <a
      routerLink="/forgot-password"
      class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline ml-1 cursor-pointer"
    >
      Reset password
    </a>
  </p>
</app-auth-layout>
