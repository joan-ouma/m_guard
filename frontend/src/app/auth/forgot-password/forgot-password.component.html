<app-auth-layout
  heading="Reset your password"
  subHeading="Enter your account email to receive a secure recovery link."
>
  <!-- Success State Banner (FR-PWD-01/03 Account Enumeration Safe) -->
  <div
    *ngIf="isSubmitted()"
    class="mb-6 p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900/50 text-emerald-800 dark:text-emerald-300 text-xs space-y-2"
    role="status"
  >
    <div class="flex items-center gap-2 font-semibold">
      <svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Recovery Instructions Sent</span>
    </div>
    <p class="leading-relaxed text-emerald-700 dark:text-emerald-400/90">
      If an account exists for <strong class="font-mono">{{ submittedEmail() }}</strong>, an email with a secure 30-minute reset link has been dispatched.
    </p>
  </div>

  <!-- Error Message Banner -->
  <div
    *ngIf="errorMessage()"
    class="mb-6 p-3.5 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 flex items-start gap-3 text-red-700 dark:text-red-400 text-xs"
    role="alert"
  >
    <svg class="w-4 h-4 shrink-0 mt-0.5 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
    <span class="leading-relaxed">{{ errorMessage() }}</span>
  </div>

  <!-- Form -->
  <form *ngIf="!isSubmitted()" [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label for="email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
        Your email
      </label>
      <div class="relative">
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="dispatcher@mguard.co.ke"
          autocomplete="email"
          class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition"
          [class.border-red-400]="isFieldInvalid('email')"
        />
      </div>
      <p *ngIf="isFieldInvalid('email')" class="mt-1 text-[11px] text-red-500">
        Please enter a valid email address.
      </p>
    </div>

    <div class="pt-3">
      <button
        type="submit"
        [disabled]="form.invalid || authService.isLoading()"
        class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-700 hover:from-blue-700 hover:via-indigo-700 hover:to-violet-800 active:scale-[0.99] text-white text-sm font-semibold shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/40 disabled:opacity-50 disabled:pointer-events-none transition duration-150 flex items-center justify-center gap-2 cursor-pointer"
      >
        <svg
          *ngIf="authService.isLoading()"
          class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ authService.isLoading() ? 'Sending...' : 'Send Recovery Instructions' }}</span>
      </button>
    </div>
  </form>

  <!-- Clean Single-Line Footer Link -->
  <p class="text-xs text-slate-500 dark:text-slate-400 text-center mt-6">
    Remember your credentials?
    <a
      routerLink="/login"
      class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline ml-1 cursor-pointer"
    >
      Sign in
    </a>
  </p>
</app-auth-layout>
