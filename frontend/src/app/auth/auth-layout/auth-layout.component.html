<div class="min-h-screen w-full flex items-center justify-center p-0 md:p-6 lg:p-10 bg-white md:bg-slate-50 dark:bg-slate-950 font-sans">
  
  <!-- Centered Elevated Card with generous proportions and white framing padding on desktop, seamless on mobile -->
  <div class="w-full max-w-[1100px] min-h-screen md:min-h-[680px] md:h-[680px] bg-white dark:bg-slate-900 rounded-none md:rounded-3xl shadow-none md:shadow-2xl md:shadow-slate-900/10 border-0 md:border md:border-slate-100 dark:border-slate-800 p-0 md:p-5 flex flex-col md:flex-row items-stretch">
    
    <!-- Left Side: Branding Panel (Hidden on mobile, approx 40% width on desktop) -->
    <div class="hidden md:flex md:w-[40%] md:h-full aura-panel relative overflow-hidden rounded-2xl md:rounded-[1.75rem] flex-col justify-between p-8 sm:p-10 text-white">
      <!-- Aurora Borealis 6-layer CSS blend modes -->
      <div class="aura-layer-1" aria-hidden="true"></div>
      <div class="aura-layer-2" aria-hidden="true"></div>
      <div class="aura-layer-3" aria-hidden="true"></div>
      <div class="aura-layer-4" aria-hidden="true"></div>
      <div class="aura-layer-5" aria-hidden="true"></div>
      <div class="aura-layer-6" aria-hidden="true"></div>

      <!-- Film-grain overlay (SVG feTurbulence) -->
      <div class="aura-grain" aria-hidden="true">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" />
            <feColorMatrix
              type="matrix"
              values="0.181 0.608 0.061 0 0.075
                      0.181 0.608 0.061 0 0.075
                      0.181 0.608 0.061 0 0.075
                      0     0     0     1 0"
            />
          </filter>
          <rect width="100%" height="100%" filter="url(#grain)" />
        </svg>
      </div>

      <!-- Left Panel Clean Content (sitting above layers) -->
      <div class="relative z-10 flex flex-col justify-between h-full">
        <!-- Top-Left: Clean standalone white asterisk symbol -->
        <div class="pt-1">
          <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="2" x2="12" y2="22" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
            <line x1="19.07" y1="4.93" x2="4.93" y2="19.07" />
          </svg>
        </div>

        <!-- Bottom-Left: Simple Brand Description -->
        <div class="pt-24 md:pt-0">
          <p class="text-sm font-normal text-slate-300 mb-2">
            MotoGuard
          </p>
          <h2 class="text-2xl sm:text-3xl font-bold text-white leading-tight tracking-tight">
            Real-time GPS tracking and anti-theft security for your motorcycle.
          </h2>
        </div>
      </div>
    </div>

    <!-- Right Side: Authentication Form (Full width on mobile, approx 60% on desktop) -->
    <div class="w-full md:w-[60%] flex flex-col justify-center px-6 sm:px-10 md:px-14 lg:px-16 py-8 md:py-10">
      <div class="w-full max-w-md">
        
        <!-- Top Left: Standalone Cobalt Blue Asterisk Icon (Strictly Left-Aligned) -->
        <div class="mb-5">
          <svg class="w-7 h-7 text-indigo-600 dark:text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="2" x2="12" y2="22" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
            <line x1="19.07" y1="4.93" x2="4.93" y2="19.07" />
          </svg>
        </div>

        <!-- Strictly Left-Aligned Header Titles -->
        <div class="mb-7">
          <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white tracking-tight">
            {{ heading }}
          </h1>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">
            {{ subHeading }}
          </p>
        </div>

        <!-- Form Content Projected via ng-content -->
        <ng-content></ng-content>
      </div>
    </div>

  </div>
</div>
