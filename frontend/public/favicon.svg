<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <!-- Radar Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5"/>

  <!-- GPS Radar Wave Arcs (Emitting from tracking device) -->
  <path d="M 32 10 A 14 14 0 0 1 46 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M 32 15 A 9 9 0 0 1 41 24" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>

  <!-- GPS Active Beacon Center -->
  <circle cx="33" cy="23" r="3.2" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="33" cy="23" r="1.5" fill="#ffffff"/>

  <!-- Motorcycle Silhouette (Crisp, High Contrast, Precision Line Work) -->
  <!-- Rear Wheel -->
  <circle cx="17" cy="45" r="9" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="17" cy="45" r="3.5" fill="#27272a" stroke="#ffffff" stroke-width="2"/>

  <!-- Front Wheel -->
  <circle cx="47" cy="45" r="9" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="47" cy="45" r="3.5" fill="#27272a" stroke="#ffffff" stroke-width="2"/>

  <!-- Chassis / Swingarm / Engine Frame -->
  <path d="M 17 45 L 29 45 L 35 37 L 27 37 Z" fill="#3f3f46"/>

  <!-- Main Frame & Gas Tank & Tail -->
  <path d="M 11 35 L 20 33 L 26 31 L 34 31 L 39 36 L 43 45" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Tank & Seat Profile -->
  <path d="M 12 34 Q 18 33 24 33 L 33 30 Q 37 30 38 34 L 28 35 Q 20 36 12 34 Z" fill="#22c55e"/>

  <!-- Front Fork & Handlebars -->
  <path d="M 47 45 L 40 25 L 35 24 M 40 25 L 43 23" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Headlight beam subtle pulse -->
  <path d="M 44 26 L 51 28" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
